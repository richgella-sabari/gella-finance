<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gella Finance">
<meta name="mobile-web-app-capable" content="yes">
<title>Gella Family Finance</title>
<!-- Sprint 23.D REMAINDER — Sabari V4 brain integration + 3-ledger + extensible types + budget warn-mode + custom fields -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #050a14;
    --bg2: #0a1628;
    --panel: rgba(18, 32, 54, 0.55);
    --panel-solid: #121e34;
    --panel-border: rgba(0, 229, 204, 0.18);
    --text: #e6eef5;
    --text-mute: #8b9bad;
    --teal: #00E5CC;
    --teal-soft: rgba(0, 229, 204, 0.12);
    --blue: #0088FF;
    --amber: #FFB300;
    --red: #FF4444;
    --green: #3fb950;
    --green-soft: rgba(63, 185, 80, 0.12);
    --red-soft: rgba(255, 68, 68, 0.12);
    --shadow: 0 8px 30px rgba(0, 136, 255, 0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    background:
      radial-gradient(ellipse at top, #0a1830 0%, #050a14 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: env(safe-area-inset-bottom, 12px);
  }

  /* ── Header ─────────────────────────────────────── */
  header {
    background: rgba(5, 10, 20, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 50;
  }
  header h1 {
    font-size: 16px; font-weight: 600;
    letter-spacing: 1.5px; color: var(--teal); text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  header h1 .accent { color: #fff; }
  header .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; }
  .pill {
    padding: 4px 10px; border-radius: 999px;
    background: rgba(0, 229, 204, 0.08); color: var(--teal);
    border: 1px solid var(--panel-border);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.5px;
  }
  .pill.warn { background: rgba(255, 179, 0, 0.1); color: var(--amber);
               border-color: rgba(255, 179, 0, 0.3); }
  .pill.bad  { background: rgba(255, 68, 68, 0.1); color: var(--red);
               border-color: rgba(255, 68, 68, 0.3); }
  .pill.ok   { background: rgba(63, 185, 80, 0.1); color: var(--green);
               border-color: rgba(63, 185, 80, 0.3); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
         margin-right: 4px; box-shadow: 0 0 6px currentColor; }

  /* ── Layout ─────────────────────────────────────── */
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }

  /* ── Sprint 23.D REMAINDER 3-ledger tabs ────────── */
  .ledger-tabs {
    display: flex; gap: 6px;
    margin: 0 0 14px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .ledger-tab {
    background: transparent;
    color: var(--text-mute);
    border: 1px solid transparent;
    padding: 8px 14px;
    font-size: 13px; font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .ledger-tab:hover { color: var(--text); background: rgba(0, 229, 204, 0.06); }
  .ledger-tab.active {
    background: var(--teal-soft);
    color: var(--teal);
    border-color: rgba(0, 229, 204, 0.3);
  }

  /* ── Sprint 23.D REMAINDER budget summary ───────── */
  .budget-summary {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .budget-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 10px 12px;
    margin: 6px 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  .budget-row .bm-label {
    display: flex; flex-direction: column; gap: 2px;
  }
  .budget-row .bm-cat { font-size: 13px; font-weight: 500; color: var(--text); }
  .budget-row .bm-meta { font-size: 11px; color: var(--text-mute); }
  .budget-row .bm-value { text-align: right; }
  .budget-row .bm-pct { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .budget-row .bm-bar {
    width: 100%; height: 4px; margin-top: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px; overflow: hidden;
    grid-column: 1 / -1;
  }
  .budget-row .bm-bar .bm-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
  .budget-row.green .bm-pct { color: var(--green); }
  .budget-row.green .bm-fill { background: var(--green); }
  .budget-row.amber .bm-pct { color: var(--amber); }
  .budget-row.amber .bm-fill { background: var(--amber); }
  .budget-row.red .bm-pct { color: var(--red); }
  .budget-row.red .bm-fill { background: var(--red); }

  /* ── Sprint 23.D REMAINDER search input + custom fields ─ */
  .search-input {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    min-width: 200px;
    font-family: inherit;
  }
  .search-input:focus {
    outline: none;
    border-color: rgba(0, 229, 204, 0.5);
  }
  .cat-tag.recurring {
    background: rgba(255, 179, 0, 0.12);
    color: var(--amber);
    border-color: rgba(255, 179, 0, 0.3);
  }
  #customFieldsGrid {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  /* ── Summary cards ──────────────────────────────── */
  .summary {
    display: grid; gap: 12px;
    grid-template-columns: repeat(3, 1fr);
    margin-bottom: 16px;
  }
  .stat {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .stat .k {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-mute);
  }
  .stat .v {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 26px; font-weight: 600; margin-top: 6px;
    line-height: 1.1;
  }
  .stat.income .v { color: var(--green); }
  .stat.expense .v { color: var(--red); }
  .stat.balance .v { color: var(--teal); }

  /* ── Action bar (add entry trigger + tabs) ───── */
  .action-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .chips { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px; border-radius: 999px;
    background: var(--panel); color: var(--text-mute);
    border: 1px solid var(--panel-border);
    cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: var(--teal-soft); color: var(--teal);
    border-color: var(--teal);
  }
  .btn {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: var(--panel); color: var(--text);
    font: 600 13px/1 inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); }
  .btn-primary {
    background: var(--teal); color: #001a16; border-color: var(--teal);
    font-weight: 700;
  }
  .btn-primary:hover { opacity: 0.85; background: var(--teal); color: #001a16; }
  .btn-danger { background: transparent; color: var(--red); border-color: rgba(255,68,68,0.4); }
  .btn-danger:hover { background: var(--red-soft); color: var(--red); }

  /* ── Add Entry panel (collapsible) ──────────── */
  .add-panel {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border); border-radius: var(--radius);
    margin-bottom: 16px; overflow: hidden;
    box-shadow: var(--shadow);
    max-height: 0; transition: max-height 0.35s ease;
  }
  .add-panel.open { max-height: 700px; }
  .add-panel-inner { padding: 18px; }
  .add-panel h3 {
    font-size: 11px; letter-spacing: 1.5px; color: var(--teal);
    text-transform: uppercase; margin-bottom: 14px;
  }
  .form-grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-mute);
  }
  input, select {
    width: 100%; padding: 10px 12px; min-height: 42px;
    background: rgba(0, 0, 0, 0.3);
    color: var(--text); font: inherit; font-size: 14px;
    border: 1px solid var(--panel-border); border-radius: 8px;
    outline: none; transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--teal); }
  input::placeholder { color: rgba(139, 155, 173, 0.6); }
  select { cursor: pointer; }
  /* dark dropdown options */
  select option { background: var(--panel-solid); color: var(--text); }
  .form-actions {
    margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px;
  }

  /* ── Entries list (cards on mobile, table on desktop) ── */
  .list { background: var(--panel); backdrop-filter: blur(10px);
          border: 1px solid var(--panel-border); border-radius: var(--radius);
          overflow: hidden; box-shadow: var(--shadow); margin-bottom: 16px; }
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--panel-border);
  }
  .list-header h3 {
    font-size: 11px; letter-spacing: 1.5px; color: var(--teal);
    text-transform: uppercase;
  }
  .entry {
    display: grid; gap: 8px;
    grid-template-columns: 80px 1fr auto;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(0, 229, 204, 0.06);
    transition: background 0.1s;
  }
  .entry:hover { background: rgba(0, 229, 204, 0.04); }
  .entry:last-child { border-bottom: none; }
  .entry .date {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px; color: var(--text-mute);
  }
  .entry .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .entry .row1 {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .entry .source { font-weight: 600; color: var(--text); }
  .entry .cat-tag {
    font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
    background: var(--teal-soft); color: var(--teal);
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid rgba(0, 229, 204, 0.2);
  }
  .entry .meta {
    font-size: 11px; color: var(--text-mute);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .entry .amount {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 16px; font-weight: 700;
    text-align: right; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .entry.income .amount { color: var(--green); }
  .entry.expense .amount { color: var(--red); }
  .delete-btn {
    background: transparent; border: none; color: rgba(255, 68, 68, 0.4);
    cursor: pointer; font-size: 16px; padding: 4px 8px;
    transition: color 0.15s;
  }
  .delete-btn:hover { color: var(--red); }
  .empty {
    padding: 40px 20px; text-align: center; color: var(--text-mute);
    font-style: italic;
  }

  /* ── Audit log (compact) ──────────────────── */
  .audit {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .audit-banner {
    background: rgba(255, 179, 0, 0.08); color: var(--amber);
    border-bottom: 1px solid rgba(255, 179, 0, 0.2);
    padding: 10px 18px; font-size: 11px;
  }
  .audit-row {
    display: grid; grid-template-columns: 110px 70px 1fr;
    gap: 10px; padding: 8px 18px;
    border-bottom: 1px solid rgba(0, 229, 204, 0.05);
    font-size: 12px;
  }
  .audit-row:last-child { border-bottom: none; }
  .audit-row .when {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-mute);
  }
  .audit-row .act { font-weight: 600; font-size: 10px; letter-spacing: 0.5px; }
  .act.added { color: var(--green); }
  .act.deleted { color: var(--red); }

  /* ── Mobile (< 640px) ─────────────────────── */
  @media (max-width: 640px) {
    main { padding: 12px; }
    .summary { grid-template-columns: 1fr; }
    .stat .v { font-size: 22px; }
    .form-grid { grid-template-columns: 1fr; }
    .entry { grid-template-columns: 1fr auto; gap: 4px 12px; }
    .entry .date { grid-column: 1 / -1; font-size: 10px; }
    .entry .body { grid-column: 1; }
    .entry .amount { grid-column: 2; grid-row: 2; align-self: end; }
    /* fix iOS zoom on input focus */
    input, select { font-size: 16px; }
    /* sticky add-entry FAB on mobile */
    .fab {
      position: fixed; bottom: 16px; right: 16px;
      width: 56px; height: 56px; border-radius: 28px;
      background: var(--teal); color: #001a16;
      border: none; cursor: pointer;
      font-size: 28px; font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 229, 204, 0.4);
      z-index: 60;
      display: flex; align-items: center; justify-content: center;
    }
    .fab:active { transform: scale(0.94); }
    .desktop-add-btn { display: none; }
    .audit-row { grid-template-columns: 1fr auto; gap: 4px; }
    .audit-row .when { grid-column: 1; }
    .audit-row .act { grid-column: 2; }
    .audit-row .body { grid-column: 1 / -1; }
  }
  @media (min-width: 641px) {
    .fab { display: none; }
  }

  /* ── Name prompt ────────────────────────── */
  .name-prompt {
    background: rgba(0, 229, 204, 0.08);
    border-bottom: 1px solid var(--panel-border);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 13px;
  }
  .name-prompt input { max-width: 200px; min-height: 36px; padding: 6px 10px; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(0, 229, 204, 0.2); border-radius: 4px;
  }
</style>
</head>
<body>

<div class="name-prompt" id="namePrompt">
  <span>👤 Who's adding entries?</span>
  <input type="text" id="nameInput" placeholder="Rich or Nina" maxlength="30">
  <button class="btn btn-primary" onclick="setUser()">Continue</button>
</div>

<header>
  <h1>▲ GELLA · <span class="accent">FINANCE</span></h1>
  <div class="meta">
    <span class="pill" id="userBadge">👤 —</span>
    <span class="pill warn" id="syncStatus"><span class="dot"></span>connecting</span>
  </div>
</header>

<main>

  <!-- Summary -->
  <section class="summary">
    <div class="stat income">
      <div class="k">Income</div>
      <div class="v" id="totalIncome">₱0</div>
    </div>
    <div class="stat expense">
      <div class="k">Expenses</div>
      <div class="v" id="totalExpenses">₱0</div>
    </div>
    <div class="stat balance">
      <div class="k">Net</div>
      <div class="v" id="netBalance">₱0</div>
    </div>
  </section>

  <!-- Sprint 23.D REMAINDER — 3-ledger explicit tabs (per memory #6 UPDATED) -->
  <div class="ledger-tabs" id="ledgerTabs" role="tablist">
    <button class="ledger-tab active" data-ledger="all" onclick="setLedger('all')" role="tab">📊 All</button>
    <button class="ledger-tab" data-ledger="richgella" onclick="setLedger('richgella')" role="tab">👤 Rich</button>
    <button class="ledger-tab" data-ledger="nina" onclick="setLedger('nina')" role="tab">👤 Nina</button>
    <button class="ledger-tab" data-ledger="family" onclick="setLedger('family')" role="tab">👪 Family</button>
  </div>

  <!-- Sprint 23.D REMAINDER — Budget warn-mode summary (Q4 inform-only) -->
  <section class="budget-summary" id="budgetSummary" style="display:none;">
    <div class="list-header">
      <h3>💰 Budgets <span class="pill" style="font-size:10px;">warn-mode</span></h3>
      <span class="pill" id="budgetCount">0</span>
    </div>
    <div id="budgetGrid"></div>
  </section>

  <!-- Filter chips + add-entry button -->
  <div class="action-bar">
    <div class="chips">
      <button class="chip active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="chip" data-filter="income" onclick="setFilter('income')">Income</button>
      <button class="chip" data-filter="expense" onclick="setFilter('expense')">Expenses</button>
      <button class="chip" data-filter="thisMonth" onclick="setFilter('thisMonth')">This Month</button>
      <button class="chip" data-filter="recurring" onclick="setFilter('recurring')">🔁 Recurring</button>
    </div>
    <input type="search" id="searchBox" placeholder="🔍 search merchant/note…" oninput="setSearch(this.value)" class="search-input">
    <button class="btn btn-primary desktop-add-btn" onclick="toggleAddPanel()">＋ Add Entry</button>
    <button class="btn" onclick="exportCSV()">📥 CSV</button>
  </div>

  <!-- Add Entry (collapsible) -->
  <section class="add-panel" id="addPanel">
    <div class="add-panel-inner">
      <h3>＋ New Entry</h3>
      <div class="form-grid">
        <div class="field">
          <label>Type</label>
          <select id="type">
            <option value="income">Income</option>
            <option value="expense" selected>Expense</option>
          </select>
        </div>
        <div class="field">
          <label>Amount (PHP)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" inputmode="decimal">
        </div>
        <div class="field">
          <label>Category</label>
          <select id="category">
            <option value="">— select —</option>
            <optgroup label="Income">
              <option>Consulting</option>
              <option>Salary</option>
              <option>Business</option>
              <option>Transfer Received</option>
              <option>Other Income</option>
            </optgroup>
            <optgroup label="Expenses">
              <option>Food</option>
              <option>Transport</option>
              <option>Utilities</option>
              <option>Health</option>
              <option>Education</option>
              <option>Shopping</option>
              <option>Entertainment</option>
              <option>Household</option>
              <option>Personal</option>
              <option>Family</option>
              <option>Kids</option>
              <option>Travel</option>
              <option>Subscriptions</option>
              <option>Other</option>
            </optgroup>
          </select>
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label>Payment</label>
          <select id="payment">
            <option value="">— select —</option>
            <option>Cash</option>
            <option>Card</option>
            <option>GCash</option>
            <option>Maya</option>
            <option>Bank</option>
            <option>MariBank</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>For</label>
          <select id="forWhom">
            <option value="">— select —</option>
            <option>Rich</option>
            <option>Nina</option>
            <option>Family</option>
            <option>Kids</option>
          </select>
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Source / Payee</label>
          <input type="text" id="source" placeholder="e.g. SM Supermarket, Mendokoro, Infinity Broadband">
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Note (optional)</label>
          <input type="text" id="description" placeholder="anything to remember about this">
        </div>
        <!-- Sprint 23.D REMAINDER — reactive custom_fields_schema render slot -->
        <div id="customFieldsGrid"></div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="toggleAddPanel()">Cancel</button>
        <button class="btn btn-primary" onclick="addEntry()">Save</button>
      </div>
    </div>
  </section>

  <!-- Entries -->
  <section class="list">
    <div class="list-header">
      <h3>📋 Entries</h3>
      <span class="pill" id="entryCount">0</span>
    </div>
    <div id="tableBody"></div>
  </section>

  <!-- Audit -->
  <section class="audit">
    <div class="list-header">
      <h3>🔐 Audit Trail</h3>
      <button class="btn" onclick="toggleLog()" id="logToggle">Hide</button>
    </div>
    <div class="audit-banner">
      ⚠️ Audit is read-only and cannot be deleted. Every change is permanently recorded.
    </div>
    <div id="logSection"><div id="logBody"></div></div>
  </section>

</main>

<button class="fab" onclick="toggleAddPanel()" aria-label="Add entry">＋</button>

<script>
const firebaseConfig = { databaseURL: "https://finance-tracker-gella-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const entriesRef = db.ref('entries');
const logRef = db.ref('auditTrail');
// Sprint 23.D REMAINDER — Sabari V4 brain-side collections
const expenseTypesRef = db.ref('expense_types');
const customFieldsRef = db.ref('custom_fields_schema');
const budgetsRef = db.ref('budgets');

let entries = [];
let auditLog = [];
let expenseTypes = [];
let customFields = [];
let budgets = [];
let currentFilter = 'all';
let currentLedger = 'all';
let currentSearch = '';
let logVisible = true;

// 3-ledger ↔ forWhom mapping per memory #6 UPDATED. Webapp empirically
// preserves V3 4-value forWhom enum (Rich/Nina/Family/Kids); 3-ledger
// view collapses Kids→Family per operator Sprint 23.D Group 0 decision.
const LEDGER_TO_FORWHOM = {
  'richgella': ['Rich'],
  'nina': ['Nina'],
  'family': ['Family', 'Kids'],
};

let currentUser = localStorage.getItem('gella_user') || '';
updateUserDisplay();

function setUser() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  currentUser = name;
  localStorage.setItem('gella_user', name);
  updateUserDisplay();
  document.getElementById('namePrompt').style.display = 'none';
}

function updateUserDisplay() {
  document.getElementById('userBadge').textContent = '👤 ' + (currentUser || '—');
  if (currentUser) document.getElementById('namePrompt').style.display = 'none';
}

function getDevice() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) return '📱 iOS';
  if (/Android/.test(ua)) return '📱 Android';
  if (/Mac/.test(ua)) return '💻 Mac';
  if (/Windows/.test(ua)) return '💻 Win';
  return '🖥️ Web';
}

document.getElementById('date').value = new Date().toISOString().split('T')[0];

db.ref('.info/connected').on('value', snap => {
  const el = document.getElementById('syncStatus');
  if (snap.val()) { el.innerHTML = '<span class="dot"></span>synced'; el.className = 'pill ok'; }
  else { el.innerHTML = '<span class="dot"></span>offline'; el.className = 'pill bad'; }
});

entriesRef.on('value', snap => {
  const data = snap.val();
  if (!data) { entries = []; render(); return; }
  entries = Object.entries(data).map(([key, val]) => ({ ...val, _key: key }));
  entries.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  render();
});

logRef.on('value', snap => {
  const data = snap.val();
  if (!data) { auditLog = []; renderLog(); return; }
  auditLog = Object.entries(data).map(([key, val]) => ({ ...val, _key: key }));
  auditLog.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  renderLog();
});

// Sprint 23.D REMAINDER — reactive load of Sabari brain-side schemas
expenseTypesRef.on('value', snap => {
  const data = snap.val() || {};
  expenseTypes = Object.entries(data)
    .map(([key, val]) => ({ ...val, _key: key }))
    .filter(t => t.active !== false);
  renderCategoryDropdown();
});

customFieldsRef.on('value', snap => {
  const data = snap.val() || {};
  customFields = Object.entries(data)
    .map(([key, val]) => ({ ...val, _key: key }))
    .filter(f => f.active !== false);
  renderCustomFields();
});

budgetsRef.on('value', snap => {
  const data = snap.val() || {};
  budgets = Object.entries(data)
    .map(([key, val]) => ({ ...val, _key: key }))
    .filter(b => b.active !== false);
  renderBudgets();
});

function writeAudit(action, entryId, entry, user, device) {
  logRef.push({
    action, entryId,
    user: user || 'Unknown',
    device: device || getDevice(),
    type: entry.type, amount: entry.amount,
    category: entry.category || '',
    source: entry.source || '',
    description: entry.description || '',
    date: entry.date || '',
    ts: Date.now()
  });
}

function fmt(n) {
  return '₱' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtTime(ts) {
  if (!ts) return '-';
  return new Date(ts).toLocaleString('en-PH', {
    month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
  });
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}

function toggleAddPanel() {
  const p = document.getElementById('addPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) {
    setTimeout(() => document.getElementById('amount').focus(), 200);
  }
}

function addEntry() {
  if (!currentUser) { alert('Please enter your name first.'); return; }
  const type = document.getElementById('type').value;
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const date = document.getElementById('date').value;
  const payment = document.getElementById('payment').value;
  const forWhom = document.getElementById('forWhom').value;
  const source = document.getElementById('source').value;
  const description = document.getElementById('description').value;

  if (!amount || amount <= 0) { alert('Enter a valid amount.'); return; }
  if (!category) { alert('Select a category.'); return; }
  if (!date) { alert('Select a date.'); return; }

  // Sprint 23.D REMAINDER — collect custom fields if any are rendered
  const customFieldsPayload = {};
  document.querySelectorAll('[data-cf-name]').forEach(el => {
    const k = el.dataset.cfName;
    const v = el.value;
    if (k && v !== '' && v != null) customFieldsPayload[k] = v;
  });

  const entry = { type, amount, category, date, payment, forWhom, source, description,
                  addedBy: currentUser, device: getDevice(), ts: Date.now() };
  if (Object.keys(customFieldsPayload).length) {
    entry.custom_fields = customFieldsPayload;
  }
  const newRef = entriesRef.push(entry);
  writeAudit('ADDED', newRef.key, entry, currentUser, getDevice());

  ['amount', 'category', 'source', 'description'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.querySelectorAll('[data-cf-name]').forEach(el => { el.value = ''; });
  document.getElementById('addPanel').classList.remove('open');
}

function deleteEntry(key) {
  if (!currentUser) { alert('Please enter your name first.'); return; }
  const entry = entries.find(e => e._key === key);
  if (!entry) return;
  if (!confirm(`Delete this ${entry.type}?\n${fmt(entry.amount)} · ${entry.category || ''}\n\nWill be recorded in audit.`)) return;
  writeAudit('DELETED', key, entry, currentUser, getDevice());
  entriesRef.child(key).remove();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  render();
}

// Sprint 23.D REMAINDER — 3-ledger tab handler
function setLedger(l) {
  currentLedger = l;
  document.querySelectorAll('.ledger-tab').forEach(t => t.classList.toggle('active', t.dataset.ledger === l));
  render();
  renderBudgets();
}

// Sprint 23.D REMAINDER — search box handler
function setSearch(q) {
  currentSearch = (q || '').toLowerCase().trim();
  render();
}

// Sprint 23.D REMAINDER — apply 3-ledger filter on top of existing
// type/period filter. Webapp empirically maps forWhom value back to
// the 3-ledger model.
function applyLedger(list) {
  if (currentLedger === 'all') return list;
  const allowedForwhom = LEDGER_TO_FORWHOM[currentLedger] || [];
  return list.filter(e => allowedForwhom.includes(e.forWhom));
}

function applySearch(list) {
  if (!currentSearch) return list;
  return list.filter(e => {
    const blob = [
      e.source || '', e.description || '',
      e.category || '', e.forWhom || '',
    ].join(' ').toLowerCase();
    return blob.includes(currentSearch);
  });
}

function toggleLog() {
  logVisible = !logVisible;
  document.getElementById('logSection').style.display = logVisible ? 'block' : 'none';
  document.getElementById('logToggle').textContent = logVisible ? 'Hide' : 'Show';
}

function applyFilter(list) {
  if (currentFilter === 'income' || currentFilter === 'expense') {
    return list.filter(e => e.type === currentFilter);
  }
  if (currentFilter === 'thisMonth') {
    const now = new Date();
    const ymPrefix = now.toISOString().slice(0, 7); // 'YYYY-MM'
    return list.filter(e => (e.date || '').startsWith(ymPrefix));
  }
  if (currentFilter === 'recurring') {
    // Sprint 23.D REMAINDER Q5 α — flagged recurring entries only
    return list.filter(e => e.recurring === true);
  }
  return list;
}

function render() {
  // Sprint 23.D REMAINDER — chain through ledger + search + filter
  const ledgerScoped = applyLedger(entries);
  const filtered = applySearch(applyFilter(ledgerScoped));
  const tbody = document.getElementById('tableBody');

  if (!filtered.length) {
    tbody.innerHTML = '<div class="empty">No entries match current filters — tap ＋ to add or adjust filters.</div>';
  } else {
    tbody.innerHTML = filtered.map(e => `
      <div class="entry ${e.type}">
        <div class="date">${fmtDate(e.date)}</div>
        <div class="body">
          <div class="row1">
            <span class="source">${escapeHtml(e.source || e.category || '—')}</span>
            ${e.category ? `<span class="cat-tag">${escapeHtml(e.category)}</span>` : ''}
            ${e.recurring ? `<span class="cat-tag recurring">🔁 recurring</span>` : ''}
          </div>
          <div class="meta">
            ${e.payment ? `<span>${escapeHtml(e.payment)}</span>` : ''}
            ${e.forWhom ? `<span>· for ${escapeHtml(e.forWhom)}</span>` : ''}
            ${e.description ? `<span>· ${escapeHtml(e.description)}</span>` : ''}
            <span>· by ${escapeHtml(e.addedBy || '?')}${e.device ? ' ' + escapeHtml(e.device) : ''}</span>
          </div>
        </div>
        <div class="amount">
          ${e.type === 'income' ? '+' : '−'}${fmt(e.amount)}
          <button class="delete-btn" onclick="deleteEntry('${e._key}')" aria-label="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('entryCount').textContent = filtered.length + (filtered.length === entries.length ? '' : ' / ' + entries.length);

  // Sprint 23.D REMAINDER — summary stats scope to current ledger
  const totalIncome = ledgerScoped.filter(e => e.type === 'income').reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalExpenses = ledgerScoped.filter(e => e.type === 'expense').reduce((s, e) => s + Number(e.amount || 0), 0);
  document.getElementById('totalIncome').textContent = fmt(totalIncome);
  document.getElementById('totalExpenses').textContent = fmt(totalExpenses);
  const net = totalIncome - totalExpenses;
  const balEl = document.getElementById('netBalance');
  balEl.textContent = (net >= 0 ? '' : '−') + fmt(Math.abs(net));
  balEl.style.color = net >= 0 ? 'var(--teal)' : 'var(--red)';
}

// Sprint 23.D REMAINDER — render reactive category dropdown from
// /expense_types Firebase collection, fallback to hardcoded enum when
// collection empty (backward-compat).
function renderCategoryDropdown() {
  const sel = document.getElementById('category');
  if (!sel) return;
  // Preserve currently-selected value across re-renders
  const prev = sel.value;
  if (!expenseTypes || expenseTypes.length === 0) {
    // Hardcoded fallback already in HTML; nothing to do
    return;
  }
  // Scope-filter to currently active ledger (or 'all')
  const scoped = expenseTypes.filter(t => {
    const tls = t.ledger_scope || 'all';
    return tls === 'all' || (currentLedger !== 'all' && tls === currentLedger);
  });
  if (scoped.length === 0) return;
  // Build optgroup-style HTML: keep "Income" + "Expenses" separation
  // when V3 baseline categories are first 14. Brain-side seeds these
  // as ledger_scope='all'. Custom additions appear under "Custom".
  const v3Baseline = new Set([
    'Food','Transport','Shopping','Bills','Health','Entertainment',
    'Utilities','Education','Household','Personal','Family','Kids',
    'Travel','Subscriptions','Other',
    'Consulting','Salary','Business','Transfer Received','Other Income',
  ]);
  const baseline = scoped.filter(t => v3Baseline.has(t.name));
  const custom = scoped.filter(t => !v3Baseline.has(t.name));
  let html = '<option value="">— select —</option>';
  if (baseline.length) {
    html += '<optgroup label="Standard">';
    baseline.forEach(t => {
      html += `<option>${escapeHtml(t.name)}</option>`;
    });
    html += '</optgroup>';
  }
  if (custom.length) {
    html += '<optgroup label="Custom">';
    custom.forEach(t => {
      html += `<option>${escapeHtml(t.name)}</option>`;
    });
    html += '</optgroup>';
  }
  sel.innerHTML = html;
  // Restore prior selection if still valid
  if (prev) sel.value = prev;
}

// Sprint 23.D REMAINDER — render custom_fields_schema form fields
function renderCustomFields() {
  const grid = document.getElementById('customFieldsGrid');
  if (!grid) return;
  if (!customFields || customFields.length === 0) {
    grid.innerHTML = '';
    return;
  }
  const currentType = document.getElementById('type')?.value || 'expense';
  const scoped = customFields.filter(f => {
    const at = f.applies_to || 'all';
    if (at !== 'all' && at !== currentType) return false;
    const ls = f.ledger_scope || 'all';
    if (currentLedger !== 'all' && ls !== 'all' && ls !== currentLedger) return false;
    return true;
  });
  if (!scoped.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = scoped.map(f => {
    const id = `cf_${f._key}`;
    if (f.field_type === 'enum' && Array.isArray(f.enum_values)) {
      const opts = ['<option value="">— select —</option>']
        .concat(f.enum_values.map(v => `<option>${escapeHtml(v)}</option>`))
        .join('');
      return `<div class="field"><label>${escapeHtml(f.name)} <span style="opacity:0.5">·custom</span></label><select id="${id}" data-cf="${escapeHtml(f._key)}" data-cf-name="${escapeHtml(f.name)}">${opts}</select></div>`;
    }
    const inputType = f.field_type === 'number' ? 'number'
      : f.field_type === 'date' ? 'date'
      : 'text';
    return `<div class="field"><label>${escapeHtml(f.name)} <span style="opacity:0.5">·custom</span></label><input type="${inputType}" id="${id}" data-cf="${escapeHtml(f._key)}" data-cf-name="${escapeHtml(f.name)}" placeholder="${escapeHtml(f.name)}"></div>`;
  }).join('');
}

// Sprint 23.D REMAINDER — render budget warn-mode summary (Q4 inform-only)
function renderBudgets() {
  const section = document.getElementById('budgetSummary');
  const grid = document.getElementById('budgetGrid');
  const countEl = document.getElementById('budgetCount');
  if (!section || !grid) return;
  // Scope budgets to active ledger
  let scoped = budgets;
  if (currentLedger !== 'all') {
    scoped = budgets.filter(b => b.ledger === currentLedger);
  }
  if (!scoped.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  countEl.textContent = scoped.length;
  // Compute spent per budget within its period window
  const now = new Date();
  const computePeriodStart = (period) => {
    const d = new Date(now);
    if (period === 'month') {
      d.setDate(1); d.setHours(0,0,0,0);
    } else if (period === 'week') {
      const dow = d.getDay() === 0 ? 6 : d.getDay() - 1; // Monday-start
      d.setDate(d.getDate() - dow); d.setHours(0,0,0,0);
    } else if (period === 'day') {
      d.setHours(0,0,0,0);
    }
    return d.getTime();
  };
  grid.innerHTML = scoped.map(b => {
    const startMs = computePeriodStart(b.period);
    const allowedForwhom = LEDGER_TO_FORWHOM[b.ledger] || [];
    const spent = entries.filter(e =>
      e.type === 'expense'
      && e.category === b.category
      && allowedForwhom.includes(e.forWhom)
      && (e.ts || 0) >= startMs
    ).reduce((s, e) => s + Number(e.amount || 0), 0);
    const limit = Number(b.limit_amount || 0);
    const pct = limit > 0 ? Math.min(999, (spent / limit) * 100) : 0;
    let band = 'green';
    if (pct >= 100) band = 'red';
    else if (pct >= 80) band = 'amber';
    const remaining = limit - spent;
    const pctTxt = limit > 0 ? pct.toFixed(0) + '%' : '—';
    const remainingTxt = remaining >= 0
      ? `${fmt(remaining)} left`
      : `${fmt(Math.abs(remaining))} over`;
    return `
      <div class="budget-row ${band}">
        <div class="bm-label">
          <div class="bm-cat">${escapeHtml(b.category)} · ${escapeHtml(b.ledger)} <span style="opacity:0.55;font-size:11px">${escapeHtml(b.period)}</span></div>
          <div class="bm-meta">${fmt(spent)} of ${fmt(limit)} · ${remainingTxt}</div>
        </div>
        <div class="bm-value">
          <div class="bm-pct">${pctTxt}</div>
        </div>
        <div class="bm-bar">
          <div class="bm-fill" style="width:${Math.min(100, pct)}%"></div>
        </div>
      </div>
    `;
  }).join('');
}

// Sprint 23.D REMAINDER — re-render custom fields when type toggles
document.getElementById('type')?.addEventListener('change', renderCustomFields);

function renderLog() {
  const logBody = document.getElementById('logBody');
  if (!auditLog.length) {
    logBody.innerHTML = '<div class="empty">No audit records yet</div>';
    return;
  }
  logBody.innerHTML = auditLog.slice(0, 50).map(l => `
    <div class="audit-row">
      <span class="when">${fmtTime(l.ts)}</span>
      <span class="act ${l.action === 'ADDED' ? 'added' : 'deleted'}">${l.action}</span>
      <span class="body" style="color: var(--text-mute);">
        <span style="color:${l.type === 'income' ? 'var(--green)' : 'var(--red)'}">${fmt(l.amount || 0)}</span>
        · ${escapeHtml(l.category || '?')}
        ${l.source ? '· ' + escapeHtml(l.source) : ''}
        · ${escapeHtml(l.user || '?')} ${escapeHtml(l.device || '')}
      </span>
    </div>
  `).join('');
  if (auditLog.length > 50) {
    logBody.innerHTML += `<div class="audit-row" style="color: var(--text-mute); justify-content: center;">… and ${auditLog.length - 50} more</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}

function exportCSV() {
  // Sprint 23.D REMAINDER — export respects current ledger scope +
  // includes recurring flag + flattens custom_fields columns
  const scoped = applyLedger(entries);
  const customFieldNames = Array.from(new Set(
    scoped.flatMap(e => Object.keys(e.custom_fields || {}))
  )).sort();
  const headers = [
    'Date','Type','Category','Source/Payee','Description','Payment',
    'For','Amount','Added By','Device','Recurring',
    ...customFieldNames.map(n => `cf_${n}`),
  ];
  const rows = scoped.map(e => [
    e.date, e.type, e.category, e.source, e.description, e.payment,
    e.forWhom, e.amount, e.addedBy, e.device,
    e.recurring ? 'yes' : '',
    ...customFieldNames.map(n => (e.custom_fields || {})[n] ?? ''),
  ]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${(v ?? '').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  const ledgerTag = currentLedger === 'all' ? 'all-ledgers' : currentLedger;
  a.download = `gella-finances-${ledgerTag}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
</script>
</body>
</html>
